name: Clear Pages custom domain

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  clear-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Show current Pages config
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
      - name: Clear custom domain
        run: |
          curl -sS -f -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"cname": null}' \
            "https://api.github.com/repos/${{ github.repository }}/pages"
          echo "custom domain cleared"
      - name: Show Pages config after the change
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
