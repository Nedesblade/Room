<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Inflammatory Diet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%239dc98a' opacity='.25'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%239dc98a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #16130f;
    --panel: #201b15;
    --panel-2: #282219;
    --ink: #ece4d8;
    --ink-dim: #b3a894;
    --amber: #ffb474;
    --green: #9dc98a;
    --yellow: #e8c46a;
    --red: #e08a7a;
    --line: rgba(236,228,216,0.1);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf5ec;
      --panel: #ffffff;
      --panel-2: #f3ecdf;
      --ink: #33291d;
      --ink-dim: #7d7160;
      --amber: #c26a1e;
      --green: #4d7c3a;
      --yellow: #9a7715;
      --red: #ad4a37;
      --line: rgba(51,41,29,0.12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.55 Georgia, 'Times New Roman', serif;
  }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header h1 { font-size: 1.6rem; margin: 0.5rem 0 0.1rem; }
  header p { margin: 0 0 1.2rem; color: var(--ink-dim); font-style: italic; }

  nav { display: flex; gap: 0.4rem; margin-bottom: 1.3rem; flex-wrap: wrap; }
  nav button {
    font: inherit; font-size: 0.95rem;
    padding: 0.45rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-dim);
    cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: #241505; font-weight: 600; }
  @media (prefers-color-scheme: light) { nav button[aria-selected="true"] { color: #fff; } }

  section[hidden] { display: none; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    margin-bottom: 1rem;
  }

  /* today */
  .progress { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.6rem; }
  .ring { position: relative; width: 64px; height: 64px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: var(--panel-2); }
  .ring .fill { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset 0.4s; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; }
  .streak { color: var(--ink-dim); font-size: 0.9rem; }
  ul.check { list-style: none; margin: 0; padding: 0; }
  ul.check li { border-top: 1px solid var(--line); }
  ul.check li:first-child { border-top: none; }
  ul.check label { display: flex; gap: 0.7rem; align-items: baseline; padding: 0.55rem 0.1rem; cursor: pointer; }
  ul.check input { transform: translateY(2px) scale(1.15); accent-color: var(--green); flex: none; }
  ul.check .why { display: block; font-size: 0.83rem; color: var(--ink-dim); }
  ul.check input:checked ~ span .what { text-decoration: line-through; text-decoration-color: var(--green); opacity: 0.7; }

  /* foods */
  .search {
    width: 100%;
    font: inherit;
    padding: 0.55rem 0.9rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    margin-bottom: 1rem;
  }
  .tier h2 { font-size: 1.02rem; margin: 0 0 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .tier.go .dot { background: var(--green); }
  .tier.easy .dot { background: var(--yellow); }
  .tier.rare .dot { background: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    font-size: 0.88rem;
  }
  .none { color: var(--ink-dim); font-style: italic; font-size: 0.9rem; }

  /* meals */
  .meal h2 { font-size: 1.02rem; margin: 0 0 0.2rem; color: var(--amber); }
  .meal p { margin: 0.15rem 0; }
  .plan-note { color: var(--ink-dim); font-size: 0.88rem; margin: 0 0 0.8rem; }
  .shuffle {
    font: inherit;
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    border: none;
    background: var(--amber);
    color: #241505;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 0.4rem;
  }
  @media (prefers-color-scheme: light) { .shuffle { color: #fff; } }

  .error { color: var(--red); }
  footer { margin-top: 2.5rem; font-size: 0.8rem; color: var(--ink-dim); }
  footer a { color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Anti-Inflammatory Diet</h1>
  <p>what I eat to keep the fires down</p>
</header>

<nav role="tablist" aria-label="Sections">
  <button role="tab" aria-selected="true" data-tab="today">Today</button>
  <button role="tab" aria-selected="false" data-tab="foods">Food guide</button>
  <button role="tab" aria-selected="false" data-tab="meals">Meal ideas</button>
</nav>

<div id="app"><p>Setting the table…</p></div>

<footer>
  General food guidance, not medical advice — talk to a professional about what's right for you.
  Checklist lives in your browser only; nothing is sent anywhere.
  Served from the <a href="https://nedesblade.github.io/Room/">room</a>'s sideboard.
  <span id="version"></span>
</footer>
</div>

<template id="layout">
  <section id="today">
    <div class="card">
      <div class="progress">
        <div class="ring" id="ring" role="img" aria-label="">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="27" fill="none" stroke-width="7"/>
            <circle class="fill" id="ring-fill" cx="32" cy="32" r="27" fill="none" stroke-width="7"/>
          </svg>
          <span class="num" id="ring-num" aria-hidden="true"></span>
        </div>
        <div>
          <strong id="cheer"></strong>
          <div class="streak" id="streak" aria-live="polite"></div>
        </div>
      </div>
      <ul class="check" id="habit-list"></ul>
    </div>
  </section>

  <section id="foods" hidden>
    <input class="search" id="food-search" type="search" placeholder="search a food… (e.g. salmon, sugar, rice)" aria-label="Search foods">
    <div class="card tier go"><h2><span class="dot"></span>Eat freely</h2><div class="chips" data-tier="go"></div></div>
    <div class="card tier easy"><h2><span class="dot"></span>Easy does it</h2><div class="chips" data-tier="easy"></div></div>
    <div class="card tier rare"><h2><span class="dot"></span>Keep rare</h2><div class="chips" data-tier="rare"></div></div>
  </section>

  <section id="meals" hidden>
    <p class="plan-note">Today's plate, same all day — or <button class="shuffle" id="shuffle">shuffle it</button></p>
    <div class="card meal"><h2>Breakfast</h2><p id="m-breakfast"></p></div>
    <div class="card meal"><h2>Lunch</h2><p id="m-lunch"></p></div>
    <div class="card meal"><h2>Dinner</h2><p id="m-dinner"></p></div>
    <div class="card meal"><h2>Snack</h2><p id="m-snack"></p></div>
  </section>
</template>

<script>
const VERSION = 'v1.1';

/* ---- dates are LOCAL: the day flips at the user's midnight ---------- */
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const dayKey = d => 'aid-day-' + localDateStr(d);
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* deterministic per-day random, so the meal plan holds still all day */
function seeded(dateStr) {
  let h = 2166136261;
  for (const c of dateStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => {
    h = Math.imul(h ^ (h >>> 15), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}

let DATA = null;

/* ---- today ----------------------------------------------------------- */
function doneCount(state) { return DATA.habits.filter(h => state[h.id]).length; }
function goal() { return Math.ceil(DATA.habits.length * 0.6); }

function renderHabits() {
  const state = load(dayKey(new Date()));
  const ul = document.getElementById('habit-list');
  ul.innerHTML = '';
  for (const h of DATA.habits) {
    const li = document.createElement('li');
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = !!state[h.id];
    box.addEventListener('change', () => {
      const s = load(dayKey(new Date()));
      s[h.id] = box.checked;
      save(dayKey(new Date()), s);
      updateProgress();
    });
    const span = document.createElement('span');
    const what = document.createElement('span'); what.className = 'what'; what.textContent = h.what;
    const why = document.createElement('span'); why.className = 'why'; why.textContent = h.why;
    span.append(what, why);
    label.append(box, span);
    li.appendChild(label);
    ul.appendChild(li);
  }
  updateProgress();
}

function calcStreak() {
  /* consecutive days at or above the goal; an unfinished today doesn't
     break the chain, it just isn't counted yet */
  const okOn = d => doneCount(load(dayKey(d))) >= goal();
  const d = new Date();
  let streak = 0;
  if (!okOn(d)) d.setDate(d.getDate() - 1);
  while (okOn(d) && streak < 3660) { streak++; d.setDate(d.getDate() - 1); }
  return { streak, todayCounted: okOn(new Date()) };
}

function updateProgress() {
  const done = doneCount(load(dayKey(new Date())));
  const total = DATA.habits.length;
  const r = 27, c = 2 * Math.PI * r;
  const fill = document.getElementById('ring-fill');
  fill.style.strokeDasharray = c;
  fill.style.strokeDashoffset = c * (1 - done / total);
  document.getElementById('ring-num').textContent = `${done}/${total}`;
  document.getElementById('ring').setAttribute('aria-label', `${done} of ${total} habits done today`);
  document.getElementById('cheer').textContent =
    done === total ? 'A perfect plate of a day.' :
    done >= goal() ? 'The fires are dying down.' :
    done > 0 ? 'Good — keep going.' : 'A fresh day.';

  const { streak, todayCounted } = calcStreak();
  document.getElementById('streak').textContent =
    streak >= 2 ? `${streak}-day streak 🔥 (the good kind of fire)${todayCounted ? '' : ' — keep it alive today'}` :
    streak === 1 ? (todayCounted ? 'Day one of a streak.' : 'Yesterday was good — make it two.') : '';
}

/* ---- foods ----------------------------------------------------------- */
function renderFoods(filter = '') {
  const q = filter.trim().toLowerCase();
  for (const [tier, items] of Object.entries(DATA.foods)) {
    const el = document.querySelector(`[data-tier="${tier}"]`);
    if (!el) continue;
    el.innerHTML = '';
    const hits = items.filter(f => f.toLowerCase().includes(q));
    for (const f of hits) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = f;
      el.appendChild(chip);
    }
    if (!hits.length) {
      const none = document.createElement('span');
      none.className = 'none';
      none.textContent = 'nothing here matches.';
      el.appendChild(none);
    }
  }
}

/* ---- meals ----------------------------------------------------------- */
function renderMeals(rand) {
  for (const [slot, options] of Object.entries(DATA.meals)) {
    const el = document.getElementById('m-' + slot);
    if (el && options.length) el.textContent = options[Math.floor(rand() * options.length)];
  }
}

/* ---- tabs (mouse + arrow keys) --------------------------------------- */
function initTabs() {
  const tabs = [...document.querySelectorAll('nav [role="tab"]')];
  const select = btn => {
    tabs.forEach(b => b.setAttribute('aria-selected', String(b === btn)));
    document.querySelectorAll('#app > section').forEach(s => s.hidden = s.id !== btn.dataset.tab);
    btn.focus();
  };
  tabs.forEach((btn, i) => {
    btn.addEventListener('click', () => select(btn));
    btn.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') select(tabs[(i + 1) % tabs.length]);
      if (e.key === 'ArrowLeft') select(tabs[(i - 1 + tabs.length) % tabs.length]);
    });
  });
}

/* ---- boot ------------------------------------------------------------ */
async function boot() {
  const app = document.getElementById('app');
  try {
    const r = await fetch('data.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error();
    DATA = await r.json();
  } catch {
    app.innerHTML = '<p class="error">Couldn’t load the menu (data.json). Try a refresh.</p>';
    return;
  }
  app.innerHTML = '';
  app.appendChild(document.getElementById('layout').content.cloneNode(true));
  renderHabits();
  renderFoods();
  renderMeals(seeded(localDateStr(new Date())));
  document.getElementById('food-search').addEventListener('input', e => renderFoods(e.target.value));
  document.getElementById('shuffle').addEventListener('click', () => renderMeals(Math.random));
  initTabs();
  document.getElementById('version').textContent = ` · ${VERSION}`;
}
boot();
</script>
</body>
</html>
