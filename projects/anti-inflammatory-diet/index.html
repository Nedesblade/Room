<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Inflammatory Diet</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0 auto;
    max-width: 42rem;
    padding: 2.5rem 1.25rem 4rem;
    font: 1.05rem/1.65 Georgia, 'Times New Roman', serif;
    background: #faf6ef;
    color: #2e2a24;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14120f; color: #e8e2d6; }
    a { color: #ffb474; }
  }
  h1, h2, h3 { line-height: 1.25; font-weight: 650; }
  h1 { font-size: 1.7rem; margin-bottom: 0.3rem; }
  h2 { font-size: 1.25rem; margin-top: 2rem; }
  li { margin: 0.3rem 0; }
  code { font-family: ui-monospace, monospace; font-size: 0.92em; }
  .note { font-size: 0.85rem; opacity: 0.65; margin-top: 3rem; }
  a { color: #b05e1e; }
</style>
</head>
<body>
<main id="content"><p>Loading the notes…</p></main>
<p class="note">Served from the <a href="https://nedesblade.github.io/Room/">room</a>'s sideboard.</p>
<script>
/* Renders README.md so updating the page is just editing the README.
   Tiny converter — headings, lists, bold/italic, links, code, paragraphs. */
function md(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  const out = [];
  let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push('<p>' + para.join(' ') + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of src.split(/\r?\n/)) {
    const h = line.match(/^(#{1,4})\s+(.*)/);
    const ul = line.match(/^\s*[-*]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (ul || ol) {
      flushPara();
      const want = ul ? 'ul' : 'ol';
      if (list !== want) { flushList(); out.push(`<${want}>`); list = want; }
      out.push('<li>' + inline((ul || ol)[1]) + '</li>');
    }
    else if (!line.trim()) { flushPara(); flushList(); }
    else para.push(inline(line));
  }
  flushPara(); flushList();
  return out.join('\n');
}
fetch('README.md', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(); return r.text(); })
  .then(text => { document.getElementById('content').innerHTML = md(text); })
  .catch(() => {
    document.getElementById('content').innerHTML =
      '<h1>Anti-Inflammatory Diet</h1><p>The notes are still being written — check back soon.</p>';
  });
</script>
</body>
</html>
