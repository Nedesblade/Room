  :root {
    /* --bg is sampled from the photo's corner pixel so it melts into the page */
    --bg: #40535c;
    --ink: #ece4d8;
    --ink-dim: #a9b8be;
    --amber: #ffb474;
    --amber-deep: #e8934f;
    --card: rgba(22, 31, 36, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 380;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 3.5rem 1.25rem 4rem;
  }

  header h1 {
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    font-weight: 640;
    letter-spacing: -0.015em;
    margin-bottom: 0.5rem;
  }
  header p {
    color: var(--ink-dim);
    max-width: 34rem;
  }

  /* ---- the room -------------------------------------------------- */
  .room {
    position: relative;
    margin: 2.25rem 0 0;
  }
  .room img {
    display: block;
    width: 100%;
    height: auto;
  }

  .spot {
    position: absolute;
    display: block;
  }
  .spot:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
    border-radius: 10px;
  }
  .spot .dot {
    position: absolute;
    width: 15px;
    height: 15px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe6c4, var(--amber) 55%, var(--amber-deep));
    box-shadow: 0 0 8px 2px rgba(255, 180, 116, 0.75), 0 0 22px 6px rgba(255, 160, 90, 0.35);
    animation: pulse 2.6s ease-in-out infinite;
    transition: scale 0.2s ease;
  }
  .spot:hover .dot,
  .spot:focus-visible .dot {
    animation-play-state: paused;
    scale: 1.25;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px 1px rgba(255, 180, 116, 0.55), 0 0 16px 4px rgba(255, 160, 90, 0.22); }
    50%      { box-shadow: 0 0 10px 3px rgba(255, 190, 130, 0.9), 0 0 30px 10px rgba(255, 165, 95, 0.4); }
  }

  .spot .tag {
    position: absolute;
    transform: translate(-50%, calc(-100% - 16px));
    white-space: nowrap;
    font-family: 'Spline Sans Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    color: #ffd9ae;
    background: rgba(16, 23, 27, 0.88);
    border: 1px solid rgba(255, 180, 116, 0.35);
    border-radius: 6px;
    padding: 0.25rem 0.55rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .spot:hover .tag,
  .spot:focus-visible .tag { opacity: 1; }

  /* ---- the card -------------------------------------------------- */
  .card {
    margin-top: 1.5rem;
    min-height: 6.5rem;
    padding: 1.1rem 1.3rem;
    background: var(--card);
    border: 1px solid rgba(236, 228, 216, 0.08);
    border-radius: 14px;
  }
  .card .hint { color: var(--ink-dim); }
  .card h2 {
    font-size: 1.15rem;
    font-weight: 620;
    margin-bottom: 0.2rem;
  }
  .card h2 a { color: var(--ink); text-decoration-color: rgba(255, 180, 116, 0.5); }
  .card h2 a:hover { color: var(--amber); }
  .card .blurb { color: var(--ink-dim); }
  .meta {
    font-family: 'Spline Sans Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    color: rgba(255, 180, 116, 0.75);
    margin-top: 0.45rem;
  }

  /* ---- the plain list -------------------------------------------- */
  .list { margin-top: 3rem; }
  .list h2 {
    font-size: 1.05rem;
    font-weight: 620;
    color: var(--ink-dim);
    margin-bottom: 0.9rem;
  }
  .list ul { list-style: none; }
  .list li { margin-bottom: 0.85rem; }
  .list a {
    color: var(--ink);
    font-weight: 540;
    text-decoration-color: rgba(255, 180, 116, 0.5);
    text-underline-offset: 3px;
  }
  .list a:hover { color: var(--amber); }
  .list a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 3px; }
  .list .blurb { color: var(--ink-dim); }

  .status {
    margin-top: 1.4rem;
    font-family: 'Spline Sans Mono', ui-monospace, monospace;
    font-size: 0.74rem;
    color: var(--ink-dim);
  }
  .status:empty { display: none; }

  footer {
    margin-top: 4rem;
    font-family: 'Spline Sans Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    color: rgba(169, 184, 190, 0.6);
  }

  /* ---- phones ---------------------------------------------------- */
  @media (max-width: 640px) {
    .spot .tag { display: none; }
    .spot .dot { width: 22px; height: 22px; }
    .wrap { padding-top: 2.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spot .dot { animation: none; }
    .spot .dot, .spot .tag { transition: none; }
  }
</style>
</head>

    <div class="card" id="card" aria-live="polite">
      <p class="hint">run your cursor over the lights, or tab through them.</p>
    </div>

    <section class="list" id="projects">
      <h2>the full inventory</h2>
      <ul id="project-list"></ul>
      <p class="status" id="status"></p>
    </section>
  </main>

  <footer>that's my actual room, more or less · be nice to the rug</footer>
</div>

<script>
/* =====================================================================
   THE SPOTS — edit these to nudge a dot.
   x/y is where the dot sits; box is [left, top, width, height] of the
   clickable area. Everything is a % of the photo, so it scales.
   A repo topic like "on-bed" pins that project to the matching spot.
   ===================================================================== */
const SPOTS = [
  { id: 'window',     x: 15,   y: 36,   box: [6,    19,   19,   37] },
  { id: 'desk',       x: 28,   y: 56,   box: [19,   50,   20,   21] },
  { id: 'wardrobe',   x: 39.5, y: 45,   box: [31.5, 33,   15.5, 30] },
  { id: 'bed',        x: 61,   y: 62,   box: [42,   55,   35,   20] },
  { id: 'nightstand', x: 83,   y: 62,   box: [77,   55,   12.5, 21] },
  { id: 'mirror',     x: 87,   y: 40,   box: [80,   25,   18,   30] },
  { id: 'rug',        x: 55,   y: 77.5, box: [35,   72.5, 45,   11] },
];

/* Whose GitHub to raid for projects (topic: "room"). */
const USERNAME = 'meledens100-lab';

/* Stand-ins so the page is never blank. Replaced once GitHub answers. */
const EXAMPLES = [
  { name: 'Cloud Diary',    blurb: 'Photos of the sky from this exact window.',              url: '#projects', pushed: null, pin: 'window' },
  { name: 'Tiny Recipe Box', blurb: 'The seven dinners I actually cook, on rotation.',       url: '#projects', pushed: null, pin: 'desk' },
  { name: 'Outfit Roulette', blurb: 'Spin the wheel, wear the result. No refunds.',          url: '#projects', pushed: null, pin: 'wardrobe' },
  { name: 'Dream Journal',  blurb: 'Half-remembered nonsense, faithfully transcribed.',      url: '#projects', pushed: null, pin: 'bed' },
  { name: 'Mixtape Shelf',  blurb: 'Playlists for extremely specific moods.',                url: '#projects', pushed: null, pin: 'nightstand' },
  { name: 'Mirror Notes',   blurb: 'Pep talks I leave for tomorrow-me.',                     url: '#projects', pushed: null, pin: 'mirror' },
  { name: 'Little Museum',  blurb: 'Things I found on the floor and refuse to throw away.',  url: '#projects', pushed: null, pin: 'rug' },
];

const room = document.getElementById('room');
const card = document.getElementById('card');
const listEl = document.getElementById('project-list');
const statusEl = document.getElementById('status');

function titleCase(slug) {
  return slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function timeAgo(iso) {
  if (!iso) return 'an example project';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  const steps = [[31536000, 'year'], [2592000, 'month'], [604800, 'week'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
  for (const [len, word] of steps) {
    const n = Math.floor(s / len);
    if (n >= 1) return `updated ${n} ${word}${n > 1 ? 's' : ''} ago`;
  }
  return 'updated just now';
}

function showCard(p) {
  card.innerHTML = '';
  const h = document.createElement('h2');
  const a = document.createElement('a');
  a.href = p.url; a.textContent = p.name;
  h.appendChild(a);
  const blurb = document.createElement('p');
  blurb.className = 'blurb'; blurb.textContent = p.blurb;
  const meta = document.createElement('p');
  meta.className = 'meta'; meta.textContent = timeAgo(p.pushed);
  card.append(h, blurb, meta);
}

function render(projects) {
  /* Pinned projects claim their spot; the rest fill remaining spots in order. */
  const taken = new Map();
  for (const p of projects) {
    if (p.pin && SPOTS.some(s => s.id === p.pin) && !taken.has(p.pin)) taken.set(p.pin, p);
  }
  const leftovers = projects.filter(p => taken.get(p.pin) !== p);
  for (const spot of SPOTS) {
    if (!taken.has(spot.id) && leftovers.length) taken.set(spot.id, leftovers.shift());
  }

  room.querySelectorAll('.spot').forEach(el => el.remove());
  let i = 0;
  for (const spot of SPOTS) {
    const p = taken.get(spot.id);
    if (!p) continue;
    const [bl, bt, bw, bh] = spot.box;
    const a = document.createElement('a');
    a.className = 'spot';
    a.href = p.url;
    a.setAttribute('aria-label', `${p.name} — ${p.blurb}`);
    a.style.cssText = `left:${bl}%;top:${bt}%;width:${bw}%;height:${bh}%`;
    const dx = ((spot.x - bl) / bw) * 100, dy = ((spot.y - bt) / bh) * 100;
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.cssText = `left:${dx}%;top:${dy}%;animation-delay:${(i * 0.4).toFixed(1)}s`;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.style.cssText = `left:${dx}%;top:${dy}%`;
    tag.textContent = p.name;
    a.append(dot, tag);
    a.addEventListener('mouseenter', () => showCard(p));
    a.addEventListener('focus', () => showCard(p));
    room.appendChild(a);
    i++;
  }

  listEl.innerHTML = '';
  for (const p of projects) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = p.url; a.textContent = p.name;
    const blurb = document.createElement('span');
    blurb.className = 'blurb'; blurb.textContent = ` — ${p.blurb}`;
    const meta = document.createElement('p');
    meta.className = 'meta'; meta.textContent = timeAgo(p.pushed);
    li.append(a, blurb, meta);
    listEl.appendChild(li);
  }
}

async function load() {
  render(EXAMPLES);
  if (!USERNAME || USERNAME === 'YOUR-USERNAME-HERE') {
    statusEl.textContent = 'no github username set yet, so these are pretend projects.';
    return;
  }
  try {
    const r = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated&type=owner`);
    if (!r.ok) throw new Error();
    const repos = await r.json();
    const mine = (Array.isArray(repos) ? repos : [])
      .filter(x => !x.archived && (x.topics || []).includes('room'));
    if (!mine.length) {
      statusEl.textContent = 'nothing on github is tagged “room” yet, so these are pretend projects for now.';
      return;
    }
    render(mine.map(x => ({
      name: titleCase(x.name),
      blurb: x.description || 'no description yet. mysterious.',
      url: x.homepage || x.html_url,
      pushed: x.pushed_at,
      pin: (x.topics || [])
        .map(t => (t.match(/^on-(.+)$/) || [])[1])
        .find(id => id && SPOTS.some(s => s.id === id)) || null,
    })));
    statusEl.textContent = 'fresh from github.';
  } catch {
    statusEl.textContent = "couldn't reach github just now, so these are pretend projects.";
  }
}

load();
</script>
