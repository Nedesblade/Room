# ─────────────────────────────────────────────────────────────────────
# publish-to-room: host a private project's static site inside the Room
# ─────────────────────────────────────────────────────────────────────
# Copy this file into any PRIVATE project repo at:
#     .github/workflows/publish-to-room.yml
#
# On every push it copies the project's static files into the Room repo
# under projects/<repo-name>/, and the Room redeploys itself. Friends
# then reach the project at:
#     https://nedesblade.github.io/Room/projects/<repo-name>/
# while this repo's source stays private. The room's page automatically
# prefers that hosted copy when the repo is private.
#
# One-time setup in the project repo:
#   1. If your site isn't in the repo root, change PUBLISH_DIR below
#      (e.g. dist, build, public). It must contain an index.html.
#   2. Settings → Secrets and variables → Actions → New repository secret:
#      name ROOM_PUSH_TOKEN, value = a fine-grained personal access token
#      with "Contents: read and write" on the Room repo only.
#      (Note: this must be a DIFFERENT token than the read-only one in
#      the Room repo's ROOM_REPOS_TOKEN — this one needs write access.)

name: Publish to the room

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PUBLISH_DIR: .   # folder holding your static site, relative to the repo root

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      - uses: actions/checkout@v4
        with:
          repository: Nedesblade/Room
          ref: main
          token: ${{ secrets.ROOM_PUSH_TOKEN }}
          path: room

      - name: Copy static files into the room
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p "room/projects/$NAME"
          rsync -a --delete --exclude '.git' --exclude '.github' \
            "project/$PUBLISH_DIR/" "room/projects/$NAME/"

      - name: Commit and push
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          cd room
          git config user.name "$NAME publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "projects/$NAME"
          git diff --cached --quiet || git commit -m "Publish $NAME to the room"
          git push
